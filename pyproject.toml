[project]
name = "question-trainer"
version = "0.1.0"
description = "Flashcard-style GitBook question trainer with FSRS spaced repetition."
readme = "README.md"

# Locked to 3.11–3.12: the optimizer (Settings-tab "Optimize" button) needs torch,
# which has no wheels for 3.13 yet. Everything else runs on 3.13 too, but pinning
# below it keeps the full feature set working.
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.119",
    "uvicorn>=0.38",
    "jinja2>=3.1",
    "requests>=2.32",
    "mistune>=3.1",
    "beautifulsoup4>=4.12",
    "psycopg[binary]>=3,<4",
    "sqlmodel>=0.0.21",
    "fsrs>=6,<7",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "bcrypt>=4.1",
    "pypdf>=4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# FSRS weight training for the Settings tab. Pulls in torch/numpy/pandas/tqdm.
#   uv sync --extra optimizer
optimizer = ["fsrs[optimizer]>=6,<7", "torch"]

# On Linux the default torch is the ~2.5 GB CUDA build; there's no GPU on Railway, so
# pull the lean CPU-only wheel instead (~200 MB). macOS keeps its normal PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
